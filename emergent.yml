version: 1
name: qwen-chat-app
description: "Qwen Chat Application with FastAPI backend and React frontend"

build:
  context: .
  dockerfile: Dockerfile

services:
  app:
    port: 80
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST}
      - MODEL_NAME=${MODEL_NAME}
      - PYTHONUNBUFFERED=1
    healthcheck:
      path: /api/health
      interval: 30s
      timeout: 5s
      retries: 3

routes:
  - path: /
    service: app
